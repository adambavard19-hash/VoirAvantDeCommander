name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vadc
          POSTGRES_PASSWORD: vadc_dev_password
          POSTGRES_DB: vadc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vadc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vadc:vadc_dev_password@localhost:5432/vadc_test
      TEST_DATABASE_URL: postgresql://vadc:vadc_dev_password@localhost:5432/vadc_test
      APP_URL: http://localhost:3000
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
